[package]
name = "mixio-cli"
version = "0.0.6"
edition = "2021"
description = "CLI for Mixio Studio — profiles across orgs, dynamic client for the hosted MCP tool surface"
homepage = "https://mixio.studio"
repository = "https://github.com/mixiopro/mixio-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "mixio"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.5", features = ["derive", "string"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
rpassword = "7"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
